name: Package and Release
on:
  workflow_dispatch:
  push:
    tags:
      - "**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN || secrets.WAGO_API_KEY || secrets.KEY }}

      - name: Update Discord
        if: success()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MODE: ${{ github.event_name == 'workflow_dispatch' && 'sync' || 'release' }}
        run: |
          bash .github/discord-notify.sh
          if [ "$DISCORD_MODE" = "sync" ] && [ -n "$(git status --porcelain .github/discord-message-id)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/discord-message-id
            git commit -m "Remember Discord message id"
            git push
          fi
